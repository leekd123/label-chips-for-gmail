<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title>Label Chips for Gmail 설정</title>
    <link rel="stylesheet" href="options.css">
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <section>
      <h2>검색</h2>

      <div class="field">
        <label><input type="checkbox" id="excludeArchives"> 전체보관함 제외</label>
        <p class="desc">전체보관함([Gmail]/All Mail)을 라벨 검색에서 뺍니다.</p>
        <p class="warning">끄면 메일을 열 때마다 전체보관함을 검색하므로 Thunderbird가 느려지거나 잠시 멈출 수 있습니다.</p>
      </div>

      <div class="field">
        <label><input type="checkbox" id="excludeJunk"> 스팸 제외</label>
        <p class="desc">스팸 폴더를 라벨 검색에서 뺍니다.</p>
      </div>

      <div class="field">
        <label><input type="checkbox" id="excludeTrash"> 휴지통 제외</label>
        <p class="desc">휴지통 폴더를 라벨 검색에서 뺍니다.</p>
      </div>
    </section>

    <section>
      <h2>캐시</h2>

      <div class="field">
        <label for="labelCacheMinutes">라벨 캐시 유지 시간 (분)</label>
        <div class="row">
          <input type="number" id="labelCacheMinutes" min="1" max="1440" step="1" inputmode="numeric">
          <span class="error" id="labelCacheMinutes-error" role="alert"></span>
        </div>
        <p class="desc">한 번 찾은 라벨을 다시 검색하지 않고 보여 주는 시간입니다. 1–1440분, 기본값 30분.</p>
      </div>
    </section>

    <button type="button" id="reset">기본값으로 되돌리기</button>
  </body>
</html>
